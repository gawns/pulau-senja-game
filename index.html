<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#2A2019" />
    <title>Pulau Senja</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='4' fill='%232A2019'/%3E%3Ccircle cx='8' cy='9' r='4.5' fill='%23F5A63B'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <canvas id="view"></canvas>

      <div id="hud">
        <section id="quest" aria-live="polite">
          <header id="quest-head">
            <p id="quest-kicker"></p>
            <button id="quest-fold" type="button" aria-label="Lipat quest">▾</button>
          </header>
          <p id="quest-title"></p>
          <p id="quest-detail"></p>
          <div id="quest-dots"></div>
          <div id="quest-bar" hidden><i></i></div>
          <div id="side"></div>
        </section>

        <div id="clock-card">
          <span id="clock-icon">☀</span>
          <div>
            <p id="clock-day"></p>
            <p id="clock-time"></p>
          </div>
          <div id="clock-arc"><i id="clock-sun"></i></div>
        </div>

        <div id="bag"></div>

        <p id="prompt" hidden></p>
        <p id="toast" hidden></p>

        <button id="craft-chip" type="button"><b>C</b> Bangun</button>

        <div id="ach">
          <button id="ach-btn" type="button"><span>🏆</span><b id="ach-count">0/9</b></button>
          <div id="ach-list"></div>
        </div>
      </div>

      <div id="dialog" hidden>
        <div id="dialog-head">
          <span id="dialog-portrait"></span>
          <div>
            <p id="dialog-name"></p>
            <div id="dialog-dots"></div>
          </div>
        </div>
        <p id="dialog-text"></p>
        <div id="dialog-foot">
          <span id="dialog-hint">Enter / klik</span>
          <button id="dialog-next" type="button">Lanjut</button>
        </div>
      </div>

      <div id="craft" hidden>
        <div id="craft-top">
          <p id="craft-title">Bangun</p>
          <button id="craft-close" type="button" aria-label="Tutup">✕</button>
        </div>
        <div id="craft-tabs" role="tablist"></div>
        <div id="craft-grid"></div>
        <div id="craft-detail">
          <p id="craft-desc"></p>
          <button id="craft-make" type="button">Buat</button>
        </div>
        <p id="craft-hint">←→ pilih · Enter buat · C tutup</p>
      </div>

      <div id="card" hidden>
        <p id="card-kicker"></p>
        <h2 id="card-title"></h2>
        <p id="card-body"></p>
        <div id="card-stats"></div>
        <div id="card-actions"></div>
      </div>

      <div id="sleep" hidden>
        <div id="sleep-card">
          <p id="sleep-kicker">Hari baru</p>
          <h2 id="sleep-title"></h2>
          <div id="sleep-stats"></div>
          <p id="sleep-note">zZz</p>
        </div>
      </div>

      <div id="end" hidden>
        <p id="end-kicker">Tamat</p>
        <h2>Pulau Senja</h2>
        <p id="end-body">Kau tiba di kota. Lampu pelabuhan menyala di balik kabut.</p>
        <p id="end-stats"></p>
        <button id="again" type="button">Mulai lagi</button>
      </div>

      <div id="menu" hidden>
        <h1>Jeda</h1>
        <ul>
          <li>WASD jalan · mouse lihat</li>
          <li>E aksi · C bangun · M bisu</li>
          <li>Esc jeda</li>
        </ul>
        <label id="vol-row">Volume <input id="vol" type="range" min="0" max="1" step="0.05" value="0.7" /></label>
        <button id="start" type="button">Lanjut</button>
      </div>

      <div id="intro">
        <div id="intro-card">
          <p id="intro-kicker"></p>
          <h1 id="intro-title"></h1>
          <div id="intro-body"></div>
          <ul id="intro-keys">
            <li><b>WASD</b> jalan</li>
            <li><b>Mouse</b> lihat</li>
            <li><b>E</b> aksi</li>
            <li><b>C</b> bangun</li>
            <li><b>M</b> bisu</li>
          </ul>
          <button id="intro-go" type="button">Buka mata</button>
        </div>
      </div>

      <div id="cutbar" hidden><span id="cut-label"></span><i id="cut-fill"></i></div>

      <div id="touch" hidden>
        <div id="pad">
          <button type="button" data-key="KeyW" aria-label="Maju">▲</button>
          <button type="button" data-key="KeyA" aria-label="Kiri">◀</button>
          <button type="button" data-key="KeyS" aria-label="Mundur">▼</button>
          <button type="button" data-key="KeyD" aria-label="Kanan">▶</button>
        </div>
        <div id="touch-acts">
          <button type="button" data-act="e">E</button>
          <button type="button" data-act="c">C</button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
